name: Bug report
description: Report a broken interaction, incorrect result or display problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Thanks for testing GitHub Protector. Do not attach private files, passwords, tokens or personal messages."
  - type: input
    id: page
    attributes:
      label: Affected page or tool
      placeholder: "Example: Suspicious Link Checker"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use safe sample data only.
      placeholder: "1. Opened…\n2. Pressed…\n3. Saw…"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and operating system
      placeholder: "Example: Chrome 153 on macOS"
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed private or identifying information from this report.
          required: true
