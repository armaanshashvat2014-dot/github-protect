<!doctype html><html><head><meta charset="utf-8"><style>
:root{color-scheme:dark;--bg:#070b13;--card:#101a2a;--line:#2a3d59;--text:#eef6ff;--muted:#9db0c8;--blue:#62adff;--green:#42dda0;--amber:#ffd166;--red:#ff7288}*{box-sizing:border-box}body{width:410px;margin:0;background:radial-gradient(circle at 90% 0,#18365d,transparent 35%),var(--bg);color:var(--text);font:13px/1.45 system-ui;padding:16px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:19px;margin:0}.switch{display:flex;align-items:center;gap:7px;font-weight:800}.switch input{accent-color:var(--green)}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:14px 0}.stat,.panel,.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}.stat b{display:block;font-size:19px}.toolbar,.actions,.bottom{display:flex;gap:7px;flex-wrap:wrap}.panel{margin:10px 0}.urlrow{display:grid;grid-template-columns:1fr auto;gap:7px}input,select{min-width:0;border:1px solid var(--line);border-radius:9px;background:#070d18;color:var(--text);padding:9px;outline:none}input:focus{border-color:var(--blue)}button,a{border:1px solid #385170;border-radius:9px;padding:8px 10px;background:#1b2b43;color:var(--text);text-decoration:none;cursor:pointer;font-weight:750}button.primary{background:var(--blue);color:#05111d;border-color:var(--blue)}button:hover,a:hover{filter:brightness(1.12)}.feed{color:var(--muted);font-size:11px;margin-top:8px}.list{display:grid;gap:8px;max-height:310px;overflow:auto;margin-top:10px}.name{font-weight:800;overflow-wrap:anywhere;padding-right:55px}.meta{color:var(--muted);font-size:11px;overflow-wrap:anywhere}.tag{float:right;font-size:10px;text-transform:uppercase;font-weight:900}.blocked,.danger{color:var(--red)}.warning{color:var(--amber)}.safe{color:var(--green)}.result{margin-top:8px;color:var(--muted)}.bottom{margin-top:12px}.grow{flex:1}.off{color:var(--amber)}</style></head><body>
<header><h1>🛡️ GitHub Protect <small>2.0</small></h1><label class="switch"><input id="enabled" type="checkbox"> <span id="state">Watching</span></label></header>
<div class="summary"><div class="stat"><b id="total">0</b>Checked</div><div class="stat"><b id="warn">0</b>Warnings</div><div class="stat"><b id="blocked">0</b>Paused</div></div>
<div class="panel"><strong>Check a link before opening</strong><div class="urlrow"><input id="url" type="url" placeholder="https://example.com"><button class="primary" id="checkUrl">Check</button></div><div class="result" id="urlResult">Uses local rules and the cached URLhaus feed.</div><div class="feed" id="feedStatus"></div></div>
<div class="toolbar"><input class="grow" id="search" placeholder="Search download history"><select id="filter"><option value="all">All</option><option value="risk">Warnings</option><option value="paused">Paused</option><option value="safe">Safe</option></select></div>
<div class="list" id="list"></div>
<div class="bottom"><a href="https://armaanshashvat2014-dot.github.io/github-protect/" target="_blank">Open scanner</a><button id="export">Export</button><button id="settings">Settings</button><button id="clear">Clear</button></div>
<script src="popup.js"></script></body></html>
