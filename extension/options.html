<!doctype html><html><head><meta charset="utf-8"><style>:root{color-scheme:dark}*{box-sizing:border-box}body{max-width:780px;margin:45px auto;background:#080c15;color:#edf5ff;font:16px/1.5 system-ui;padding:20px}.card{background:#111a2a;border:1px solid #293951;border-radius:18px;padding:25px;box-shadow:0 20px 60px #0006}h1{margin-top:0}label.toggle{display:flex;gap:11px;align-items:center;margin:14px 0;font-weight:750}input[type=checkbox]{accent-color:#38d996;width:18px;height:18px}textarea{width:100%;min-height:110px;background:#080e19;color:#edf5ff;border:1px solid #354b68;border-radius:10px;padding:11px}p,small{color:#9bacbf}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.note{border-left:4px solid #ffd166;padding:10px 14px;background:#251e0d;border-radius:8px}button{border:0;border-radius:10px;padding:11px 16px;background:#58a6ff;color:#06101e;font-weight:850;cursor:pointer}.saved{color:#38d996;margin-left:10px}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><div class="card"><h1>GitHub Protect Extension 2.0</h1><label class="toggle"><input id="enabled" type="checkbox"> Enable download and link protection</label><label class="toggle"><input id="pause" type="checkbox"> Automatically pause risky downloads</label><label class="toggle"><input id="notifications" type="checkbox"> Show security notifications</label><label class="toggle"><input id="strict" type="checkbox"> Strict mode (more cautious warnings)</label><div class="grid"><div><h2>Trusted domains</h2><p>One domain per line. Trust never overrides URLhaus or your blocked list.</p><textarea id="trusted" placeholder="example.com"></textarea></div><div><h2>Blocked domains</h2><p>Downloads and links from these domains receive a high-risk warning.</p><textarea id="blocked" placeholder="suspicious.example"></textarea></div></div><p class="note">Files stay on your device. Never paste secret API keys into a public browser extension.</p><button id="save">Save settings</button><span class="saved" id="saved"></span></div><script src="options.js"></script></body></html>
