<!doctype html><html><head><meta charset="utf-8"><style>body{max-width:700px;margin:60px auto;background:#080c15;color:#edf5ff;font:16px system-ui;padding:20px}.card{background:#111a2a;border:1px solid #293951;border-radius:16px;padding:24px}label{display:flex;gap:10px;align-items:center}p{color:#9bacbf}.note{border-left:4px solid #ffd166;padding-left:14px}</style></head><body><div class="card"><h1>GitHub Protect settings</h1><label><input id="pause" type="checkbox"> Automatically pause risky downloads</label><p>Downloads are never opened, uploaded, or executed by GitHub Protect.</p><p class="note">Cloud reputation checks are disabled until a secure backend is configured. Never place VirusTotal or Google API keys directly in a public extension.</p></div><script>chrome.storage.local.get({pauseRisky:true},x=>pause.checked=x.pauseRisky);pause.onchange=()=>chrome.storage.local.set({pauseRisky:pause.checked})</script></body></html>
